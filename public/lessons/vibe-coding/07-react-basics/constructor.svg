<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="14" fill="#1e222a" stroke="#4a5160" stroke-width="2"/>
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Одни и те же компоненты — три разных лендинга</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <g>
      <text x="125" y="58" fill="#9ccfff">/ (стоматология)</text>
      <rect x="30" y="68" width="190" height="30" rx="6" fill="#0284c7"/><text x="125" y="88" fill="#fff">Header</text>
      <rect x="30" y="104" width="190" height="62" rx="6" fill="#075985"/><text x="125" y="140" fill="#fff">Hero</text>
      <rect x="30" y="172" width="190" height="62" rx="6" fill="#0369a1"/><text x="125" y="208" fill="#fff">Services · Card ×3</text>
      <rect x="30" y="240" width="190" height="34" rx="6" fill="#0284c7"/><text x="125" y="262" fill="#fff">Pricing · Card ×3</text>
      <rect x="30" y="280" width="190" height="30" rx="6" fill="#0c4a6e"/><text x="125" y="300" fill="#fff">Footer</text>
    </g>
    <g>
      <text x="360" y="58" fill="#ffd479">/cafe (кофейня)</text>
      <rect x="265" y="68" width="190" height="30" rx="6" fill="#b45309"/><text x="360" y="88" fill="#fff">Header</text>
      <rect x="265" y="104" width="190" height="62" rx="6" fill="#78350f"/><text x="360" y="140" fill="#fff">Hero</text>
      <rect x="265" y="172" width="190" height="62" rx="6" fill="#92400e"/><text x="360" y="208" fill="#fff">Services · Card ×4</text>
      <rect x="265" y="240" width="190" height="34" rx="6" fill="#b45309"/><text x="360" y="262" fill="#fff">Pricing · Card ×2</text>
      <rect x="265" y="280" width="190" height="30" rx="6" fill="#451a03"/><text x="360" y="300" fill="#fff">Footer</text>
    </g>
    <g>
      <text x="595" y="58" fill="#7ee2a8">/school (курсы английского)</text>
      <rect x="500" y="68" width="190" height="30" rx="6" fill="#059669"/><text x="595" y="88" fill="#fff">Header</text>
      <rect x="500" y="104" width="190" height="62" rx="6" fill="#065f46"/><text x="595" y="140" fill="#fff">Hero</text>
      <rect x="500" y="172" width="190" height="62" rx="6" fill="#047857"/><text x="595" y="208" fill="#fff">Services · Card ×3</text>
      <rect x="500" y="240" width="190" height="34" rx="6" fill="#059669"/><text x="595" y="262" fill="#fff">Pricing · Card ×3</text>
      <rect x="500" y="280" width="190" height="30" rx="6" fill="#064e3b"/><text x="595" y="300" fill="#fff">Footer</text>
    </g>
  </g>
  <text x="360" y="328" text-anchor="middle" font-size="12" fill="#8b95a5">меняются только данные и цвет, файлы компонентов остаются теми же</text>
</svg>
