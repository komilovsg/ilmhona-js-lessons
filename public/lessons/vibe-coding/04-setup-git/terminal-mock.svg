<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#1f1f1f" stroke="#454545" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="30" rx="12" fill="#2b2b2b"/><rect x="1" y="16" width="718" height="15" fill="#2b2b2b"/>
  <circle cx="20" cy="16" r="5" fill="#ff6b6b"/><circle cx="38" cy="16" r="5" fill="#f5c542"/><circle cx="56" cy="16" r="5" fill="#45c26b"/>
  <text x="360" y="20" text-anchor="middle" font-size="12" fill="#9d9d9d">Терминал</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">
    <text x="20" y="62" fill="#45c26b">student@laptop</text><text x="144" y="62" fill="#8ab4f8">~/vibe-course</text><text x="246" y="62" fill="#d4d4d4">$ pwd</text>
    <text x="20" y="84" fill="#d4d4d4">/Users/student/vibe-course</text>
    <text x="20" y="116" fill="#45c26b">student@laptop</text><text x="144" y="116" fill="#8ab4f8">~/vibe-course</text><text x="246" y="116" fill="#d4d4d4">$ ls</text>
    <text x="20" y="138" fill="#d4d4d4">coffee    fitness    my-site</text>
    <text x="20" y="170" fill="#45c26b">student@laptop</text><text x="144" y="170" fill="#8ab4f8">~/vibe-course</text><text x="246" y="170" fill="#d4d4d4">$ cd my-site</text>
    <text x="20" y="224" fill="#45c26b">student@laptop</text><text x="144" y="224" fill="#8ab4f8">~/vibe-course/my-site</text><text x="326" y="224" fill="#d4d4d4">$ </text>
    <rect x="344" y="211" width="9" height="16" fill="#d4d4d4"/>
  </g>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <circle cx="700" cy="62" r="11" fill="#0e7a55"/><text x="700" y="66" text-anchor="middle">1</text>
    <circle cx="700" cy="116" r="11" fill="#0e7a55"/><text x="700" y="120" text-anchor="middle">2</text>
    <circle cx="700" cy="224" r="11" fill="#0e7a55"/><text x="700" y="228" text-anchor="middle">3</text>
  </g>
  <rect x="20" y="256" width="680" height="68" rx="8" fill="#2a2a2a"/>
  <g font-size="13" fill="#cfcfcf">
    <text x="34" y="278">1 — приглашение: имя компьютера, текущая папка и значок $ (в Windows: PS C:\...&gt;)</text>
    <text x="34" y="298">2 — вы вводите команду и нажимаете Enter; ниже терминал печатает ответ</text>
    <text x="34" y="318">3 — после команды cd приглашение показывает новую папку; мигающий курсор ждёт следующей команды</text>
  </g>
</svg>
