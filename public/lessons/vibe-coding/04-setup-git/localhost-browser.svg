  <rect x="20" y="248" width="680" height="66" rx="8" fill="#eef2f0" stroke="#c9ced8"/>
  <g font-size="13" fill="#1f2a26">
    <text x="34" y="270">1 — адрес localhost:3000: «localhost» — этот же компьютер, «3000» — номер порта (двери), у вас может быть другой</text>
    <text x="34" y="290">2 — страница та же, что открывалась двойным щелчком, но теперь её отдаёт программа в терминале</text>
    <text x="34" y="306">Остановить программу: в терминале Ctrl+C. После этого адрес перестанет открываться.</text>
  </g>
