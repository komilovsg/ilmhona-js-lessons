  <circle cx="22" cy="20" r="5" fill="#ff6b6b"/><circle cx="40" cy="20" r="5" fill="#ffcc4d"/><circle cx="58" cy="20" r="5" fill="#4cd37b"/>
  <rect x="90" y="9" width="420" height="22" rx="11" fill="#fff" stroke="#0e7a55" stroke-width="2"/>
  <text x="106" y="25" font-size="13" fill="#1f2a26" font-family="ui-monospace, Menlo, Consolas, monospace">localhost:3000</text>
  <rect x="1" y="40" width="718" height="289" fill="#ffffff"/>
  <rect x="30" y="62" width="660" height="56" rx="10" fill="#0e7a55"/>
  <text x="50" y="97" font-size="22" font-weight="700" fill="#fff">Madina Rakhimova</text>
  <rect x="30" y="136" width="400" height="12" rx="5" fill="#d7dde3"/><rect x="30" y="158" width="320" height="12" rx="5" fill="#d7dde3"/>
  <rect x="30" y="190" width="110" height="34" rx="8" fill="#0e7a55"/><text x="85" y="212" text-anchor="middle" font-size="13" fill="#fff">Telegram</text>
  <circle cx="486" cy="20" r="0" fill="none"/>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <circle cx="528" cy="20" r="11" fill="#0e7a55"/><text x="528" y="24" text-anchor="middle">1</text>
    <circle cx="560" cy="150" r="11" fill="#0e7a55"/><text x="560" y="154" text-anchor="middle">2</text>
