<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="438" rx="12" fill="#1f1f1f" stroke="#454545" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="30" rx="12" fill="#2b2b2b"/><rect x="1" y="16" width="718" height="15" fill="#2b2b2b"/>
  <circle cx="20" cy="16" r="5" fill="#ff6b6b"/><circle cx="38" cy="16" r="5" fill="#f5c542"/><circle cx="56" cy="16" r="5" fill="#45c26b"/>
  <text x="360" y="20" text-anchor="middle" font-size="12" fill="#9d9d9d">vibe-course — редактор</text>
  <rect x="1" y="31" width="44" height="380" fill="#333"/>
  <rect x="14" y="48" width="18" height="22" rx="3" fill="none" stroke="#7d7d7d" stroke-width="2"/>
  <circle cx="23" cy="100" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="23" cy="118" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="32" cy="108" r="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M23 103v12M23 108h6" stroke="#fff" stroke-width="2" fill="none"/>
  <rect x="42" y="92" width="3" height="34" fill="#0e7a55"/>
  <rect x="45" y="31" width="260" height="380" fill="#252526"/>
  <text x="58" y="52" font-size="11" font-weight="700" fill="#bdbdbd" letter-spacing="1">SOURCE CONTROL</text>
  <rect x="58" y="62" width="234" height="48" rx="4" fill="#3c3c3c" stroke="#555"/>
  <text x="68" y="82" font-size="13" fill="#e0e0e0">add my-site, coffee, fitness</text>
  <text x="68" y="100" font-size="11" fill="#8a8a8a">Message (Ctrl+Enter to commit)</text>
  <rect x="58" y="120" width="234" height="30" rx="4" fill="#0e7a55"/>
  <text x="175" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Commit</text>
  <text x="58" y="176" font-size="11" font-weight="700" fill="#bdbdbd" letter-spacing="1">CHANGES  (14)</text>
  <g font-size="13" fill="#cfcfcf">
    <text x="72" y="198">README.md</text><text x="270" y="198" fill="#73c991">U</text>
    <text x="72" y="220">my-site/index.html</text><text x="270" y="220" fill="#73c991">U</text>
    <text x="72" y="242">coffee/index.html</text><text x="270" y="242" fill="#73c991">U</text>
    <text x="72" y="264">fitness/index.html</text><text x="270" y="264" fill="#73c991">U</text>
  </g>
  <rect x="305" y="31" width="414" height="380" fill="#1f1f1f"/>
  <text x="325" y="62" font-size="14" fill="#9d9d9d">После Commit кнопка меняется на</text>
  <rect x="325" y="76" width="200" height="30" rx="4" fill="#0e7a55"/>
  <text x="425" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Publish Branch</text>
  <text x="325" y="130" font-size="13" fill="#9d9d9d">Нажмите её: редактор спросит, создать репозиторий</text>
  <text x="325" y="150" font-size="13" fill="#9d9d9d">на GitHub публичным (public) или закрытым (private).</text>
  <text x="325" y="180" font-size="13" fill="#9d9d9d">Первый раз откроется браузер: войдите в GitHub</text>
  <text x="325" y="200" font-size="13" fill="#9d9d9d">и разрешите доступ. Пароль вручную вводить не нужно.</text>
  <text x="325" y="240" font-size="13" fill="#cfcfcf">U — новый файл, который Git ещё не видел</text>
  <text x="325" y="260" font-size="13" fill="#cfcfcf">M — изменённый файл, A — добавленный в коммит</text>
  <rect x="1" y="411" width="718" height="28" fill="#0e7a55"/>
  <text x="14" y="430" font-size="12" fill="#fff">main</text><text x="560" y="430" font-size="12" fill="#fff">Publish Branch ↑</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <circle cx="28" cy="145" r="11" fill="#d9534f"/><text x="28" y="149" text-anchor="middle">1</text>
    <circle cx="300" cy="86" r="0" fill="none"/>
    <circle cx="300" cy="82" r="11" fill="#d9534f"/><text x="300" y="86" text-anchor="middle">2</text>
    <circle cx="300" cy="135" r="11" fill="#d9534f"/><text x="300" y="139" text-anchor="middle">3</text>
    <circle cx="600" cy="92" r="11" fill="#d9534f"/><text x="600" y="96" text-anchor="middle">4</text>
  </g>
</svg>
