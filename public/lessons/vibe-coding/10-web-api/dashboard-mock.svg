<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="14" fill="#f4f7f6" stroke="#c9ced8" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="44" rx="14" fill="#0f766e"/><rect x="1" y="24" width="718" height="21" fill="#0f766e"/>
  <text x="22" y="29" font-size="16" font-weight="700" fill="#ffffff">Дашборд Душанбе</text>
  <rect x="560" y="12" width="140" height="22" rx="11" fill="#ccfbf1"/><text x="630" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#134e4a">Обновлено 15:30</text>
  <!-- weather -->
  <rect x="20" y="62" width="214" height="150" rx="12" fill="#ffffff" stroke="#cbd5d1" stroke-width="2"/>
  <text x="36" y="88" font-size="13" font-weight="700" fill="#475569">ПОГОДА</text>
  <text x="36" y="132" font-size="38" font-weight="700" fill="#0f172a">21 °C</text>
  <text x="36" y="158" font-size="13" fill="#475569">Ветер 8 км/ч</text>
  <text x="36" y="184" font-size="13" fill="#475569">Душанбе · сейчас</text>
  <!-- currency -->
  <rect x="253" y="62" width="214" height="150" rx="12" fill="#ffffff" stroke="#cbd5d1" stroke-width="2"/>
  <text x="269" y="88" font-size="13" font-weight="700" fill="#475569">КУРС К СОМОНИ</text>
  <g font-size="15" fill="#0f172a"><text x="269" y="122">USD</text><text x="269" y="148">RUB</text><text x="269" y="174">EUR</text></g>
  <g font-size="15" font-weight="700" fill="#0f172a" text-anchor="end"><text x="450" y="122">9,21</text><text x="450" y="148">0,11</text><text x="450" y="174">10,3</text></g>
  <!-- loading -->
  <rect x="486" y="62" width="214" height="150" rx="12" fill="#ffffff" stroke="#cbd5d1" stroke-width="2"/>
  <text x="502" y="88" font-size="13" font-weight="700" fill="#475569">СЕРИАЛЫ</text>
  <rect x="502" y="104" width="182" height="14" rx="7" fill="#e2e8f0"/><rect x="502" y="128" width="140" height="14" rx="7" fill="#e2e8f0"/><rect x="502" y="152" width="160" height="14" rx="7" fill="#e2e8f0"/>
  <text x="502" y="194" font-size="12" fill="#64748b">Загрузка…</text>
  <!-- error + list -->
  <rect x="20" y="228" width="334" height="150" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="36" y="254" font-size="13" font-weight="700" fill="#991b1b">ФИЛЬМЫ</text>
  <text x="36" y="288" font-size="15" font-weight="700" fill="#7f1d1d">Не удалось загрузить данные</text>
  <text x="36" y="310" font-size="13" fill="#7f1d1d">Проверьте интернет и повторите попытку.</text>
  <rect x="36" y="326" width="100" height="30" rx="8" fill="#dc2626"/><text x="86" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Повторить</text>
  <rect x="373" y="228" width="327" height="150" rx="12" fill="#ffffff" stroke="#cbd5d1" stroke-width="2"/>
  <text x="389" y="254" font-size="13" font-weight="700" fill="#475569">ПОИСК СЕРИАЛОВ</text>
  <rect x="389" y="266" width="210" height="28" rx="6" fill="#fff" stroke="#94a3b8"/><text x="400" y="285" font-size="13" fill="#0f172a">office</text>
  <rect x="607" y="266" width="76" height="28" rx="6" fill="#0f766e"/><text x="645" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Найти</text>
  <g font-size="13" fill="#0f172a"><text x="389" y="318">The Office · 8.5</text><text x="389" y="340">The Office (UK) · 8.5</text><text x="389" y="362" fill="#64748b">…ещё 8 результатов</text></g>
</svg>
