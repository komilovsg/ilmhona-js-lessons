<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="720" height="420" rx="14" fill="#f4f6f5"/>
  <!-- phone -->
  <rect x="40" y="20" width="250" height="380" rx="26" fill="#ffffff" stroke="#1f2a26" stroke-width="3"/>
  <rect x="52" y="34" width="226" height="352" rx="14" fill="#ffffff" stroke="#d6dcd9"/>
  <text x="68" y="62" font-size="15" font-weight="700" fill="#1f2a26">Мои заказы</text>
  <rect x="68" y="76" width="194" height="30" rx="6" fill="#ffffff" stroke="#c9cfcc"/>
  <text x="76" y="96" font-size="12" fill="#c8c8c8">Название</text>
  <rect x="68" y="114" width="194" height="30" rx="6" fill="#ffffff" stroke="#c9cfcc"/>
  <text x="76" y="134" font-size="12" fill="#c8c8c8">Телефон</text>
  <rect x="68" y="154" width="64" height="20" rx="4" fill="#e6ece9"/>
  <text x="76" y="168" font-size="10" fill="#1f2a26">OK</text>
  <text x="68" y="206" font-size="11" fill="#bdbdbd">Список заказов:</text>
  <text x="68" y="246" font-size="12" fill="#1f2a26"> </text>
  <rect x="68" y="300" width="194" height="52" rx="8" fill="#fdecec" stroke="#c0392b"/>
  <text x="76" y="322" font-size="11" font-weight="700" fill="#c0392b">Error: 500 Internal Server</text>
  <text x="76" y="340" font-size="10" fill="#c0392b">TypeError undefined (reading 'map')</text>
  <!-- markers -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="316" cy="91" r="12" fill="#b4232a"/><text x="316" y="96" text-anchor="middle">1</text>
    <circle cx="316" cy="163" r="12" fill="#b4232a"/><text x="316" y="168" text-anchor="middle">2</text>
    <circle cx="316" cy="214" r="12" fill="#b4232a"/><text x="316" y="219" text-anchor="middle">3</text>
    <circle cx="316" cy="260" r="12" fill="#b4232a"/><text x="316" y="265" text-anchor="middle">4</text>
    <circle cx="316" cy="326" r="12" fill="#b4232a"/><text x="316" y="331" text-anchor="middle">5</text>
  </g>
  <g font-size="14" fill="#1f2a26">
    <text x="340" y="96">Подсказки в полях исчезнут при вводе, подписей нет</text>
    <text x="340" y="168">Кнопка «OK»: мелкая и непонятная</text>
    <text x="340" y="219">Светло-серый текст на белом, плохо читается</text>
    <text x="340" y="265">Пустое место вместо списка, нет текста</text>
    <text x="340" y="331">Ошибка на языке разработчика</text>
  </g>
  <text x="340" y="380" font-size="12" fill="#4b5753">Учебный макет экрана. Данные вымышленные.</text>
</svg>
