<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="720" height="400" rx="14" fill="#f4f6f5"/>
  <!-- devtools frame -->
  <rect x="20" y="20" width="680" height="360" rx="10" fill="#ffffff" stroke="#c9cfcc" stroke-width="2"/>
  <rect x="20" y="20" width="680" height="36" rx="10" fill="#e6ece9"/>
  <g font-size="13" fill="#1f2a26">
    <text x="40" y="43">Elements</text><text x="120" y="43">Console</text><text x="190" y="43">Network</text>
    <rect x="266" y="26" width="90" height="30" fill="#ffffff"/>
    <text x="280" y="43" font-weight="700">Lighthouse</text>
    <rect x="266" y="54" width="90" height="3" fill="#0e7a55"/>
  </g>
  <!-- settings -->
  <text x="40" y="92" font-size="14" font-weight="700" fill="#1f2a26">Mode</text>
  <rect x="40" y="102" width="150" height="30" rx="6" fill="#ffffff" stroke="#8a948f"/>
  <text x="52" y="122" font-size="13" fill="#1f2a26">Navigation</text>
  <text x="220" y="92" font-size="14" font-weight="700" fill="#1f2a26">Device</text>
  <rect x="220" y="102" width="86" height="30" rx="6" fill="#d9efe6" stroke="#0e7a55"/><text x="236" y="122" font-size="13" fill="#1f2a26">Mobile</text>
  <rect x="314" y="102" width="86" height="30" rx="6" fill="#ffffff" stroke="#8a948f"/><text x="326" y="122" font-size="13" fill="#1f2a26">Desktop</text>
  <rect x="440" y="98" width="230" height="38" rx="8" fill="#0e7a55"/>
  <text x="555" y="122" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Analyze page load</text>
  <line x1="40" y1="158" x2="680" y2="158" stroke="#d6dcd9"/>
  <!-- scores -->
  <g font-weight="700" text-anchor="middle">
    <circle cx="130" cy="228" r="42" fill="#fff3e0" stroke="#c2410c" stroke-width="6"/><text x="130" y="238" font-size="28" fill="#9a3412">87</text><text x="130" y="302" font-size="13" fill="#1f2a26">Performance</text>
    <circle cx="270" cy="228" r="42" fill="#d9efe6" stroke="#0e7a55" stroke-width="6"/><text x="270" y="238" font-size="28" fill="#0b6444">100</text><text x="270" y="302" font-size="13" fill="#1f2a26">Accessibility</text>
    <circle cx="410" cy="228" r="42" fill="#d9efe6" stroke="#0e7a55" stroke-width="6"/><text x="410" y="238" font-size="28" fill="#0b6444">96</text><text x="410" y="302" font-size="13" fill="#1f2a26">Best Practices</text>
    <circle cx="550" cy="228" r="42" fill="#d9efe6" stroke="#0e7a55" stroke-width="6"/><text x="550" y="238" font-size="28" fill="#0b6444">91</text><text x="550" y="302" font-size="13" fill="#1f2a26">SEO</text>
  </g>
  <g font-size="12" fill="#1f2a26">
    <rect x="40" y="326" width="12" height="12" fill="#0e7a55"/><text x="58" y="337">90–100</text>
    <rect x="130" y="326" width="12" height="12" fill="#c2410c"/><text x="148" y="337">50–89</text>
    <rect x="215" y="326" width="12" height="12" fill="#b4232a"/><text x="233" y="337">0–49</text>
    <text x="320" y="337">Opportunities: Properly size images, Reduce unused JavaScript</text>
  </g>
</svg>
