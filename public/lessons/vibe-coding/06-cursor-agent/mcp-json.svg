<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#1f1f1f" stroke="#454545" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="30" rx="12" fill="#2b2b2b"/><rect x="1" y="16" width="718" height="15" fill="#2b2b2b"/>
  <circle cx="20" cy="16" r="5" fill="#ff6b6b"/><circle cx="38" cy="16" r="5" fill="#f5c542"/><circle cx="56" cy="16" r="5" fill="#45c26b"/>
  <text x="360" y="20" text-anchor="middle" font-size="12" fill="#9d9d9d">dental-landing — .cursor/mcp.json</text>
  <rect x="1" y="31" width="200" height="328" fill="#252526"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cfcfcf">
    <text x="14" y="56">▾ dental-landing</text>
    <text x="28" y="76">▾ .cursor</text>
    <text x="42" y="96" fill="#9be3c4">mcp.json</text>
    <text x="28" y="116">▸ app</text>
    <text x="28" y="136">▸ public</text>
    <text x="28" y="156">AGENTS.md</text>
    <text x="28" y="176">package.json</text>
  </g>
  <rect x="201" y="31" width="518" height="328" fill="#1f1f1f"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">
    <text x="224" y="64" fill="#cfcfcf">{</text>
    <text x="224" y="90" fill="#cfcfcf">  <tspan fill="#9cdcfe">"mcpServers"</tspan>: {</text>
    <text x="224" y="116" fill="#cfcfcf">    <tspan fill="#9cdcfe">"playwright"</tspan>: {</text>
    <text x="224" y="142" fill="#cfcfcf">      <tspan fill="#9cdcfe">"command"</tspan>: <tspan fill="#ce9178">"npx"</tspan>,</text>
    <text x="224" y="168" fill="#cfcfcf">      <tspan fill="#9cdcfe">"args"</tspan>: [<tspan fill="#ce9178">"@playwright/mcp@latest"</tspan>]</text>
    <text x="224" y="194" fill="#cfcfcf">    }</text>
    <text x="224" y="220" fill="#cfcfcf">  }</text>
    <text x="224" y="246" fill="#cfcfcf">}</text>
  </g>
  <g font-size="12" fill="#9d9d9d">
    <text x="224" y="284">Ключ — имя на левой стороне, значение — справа после двоеточия.</text>
    <text x="224" y="304">Фигурные скобки { } — «коробка» с парами, квадратные [ ] — список.</text>
    <text x="224" y="324">Запятая между парами обязательна, после последней — нельзя.</text>
  </g>
</svg>
