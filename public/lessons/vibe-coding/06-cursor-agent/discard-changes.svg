<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="12" fill="#1f1f1f" stroke="#454545" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="30" rx="12" fill="#2b2b2b"/><rect x="1" y="16" width="718" height="15" fill="#2b2b2b"/>
  <circle cx="20" cy="16" r="5" fill="#ff6b6b"/><circle cx="38" cy="16" r="5" fill="#f5c542"/><circle cx="56" cy="16" r="5" fill="#45c26b"/>
  <text x="360" y="20" text-anchor="middle" font-size="12" fill="#9d9d9d">dental-landing — Source Control</text>
  <rect x="1" y="31" width="330" height="348" fill="#252526"/>
  <text x="16" y="54" font-size="11" font-weight="700" fill="#bdbdbd" letter-spacing="1">SOURCE CONTROL</text>
  <text x="16" y="86" font-size="11" font-weight="700" fill="#bdbdbd" letter-spacing="1">CHANGES  (3)</text>
  <rect x="8" y="98" width="316" height="26" rx="4" fill="#37373d"/>
  <text x="20" y="116" font-size="13" fill="#cfcfcf">page.tsx</text><text x="90" y="116" font-size="11" fill="#8a8a8a">app</text>
  <rect x="236" y="102" width="20" height="18" rx="3" fill="#4a4a4f"/><text x="246" y="116" text-anchor="middle" font-size="13" fill="#ffffff">↶</text>
  <text x="300" y="116" font-size="13" fill="#e2c08d">M</text>
  <text x="20" y="144" font-size="13" fill="#cfcfcf">globals.css</text><text x="100" y="144" font-size="11" fill="#8a8a8a">app</text><text x="300" y="144" font-size="13" fill="#e2c08d">M</text>
  <text x="20" y="168" font-size="13" fill="#cfcfcf">Services.tsx</text><text x="106" y="168" font-size="11" fill="#8a8a8a">app/components</text><text x="300" y="168" font-size="13" fill="#73c991">U</text>
  <rect x="345" y="50" width="360" height="124" rx="8" fill="#2d2d2d" stroke="#555"/>
  <text x="360" y="74" font-size="13" font-weight="700" fill="#e0e0e0">Значок ↶ у файла = «Discard Changes»</text>
  <text x="360" y="96" font-size="12" fill="#cfcfcf">Вернёт файл к последнему commit.</text>
  <text x="360" y="116" font-size="12" fill="#cfcfcf">Редактор спросит подтверждение:</text>
  <text x="360" y="136" font-size="12" fill="#cfcfcf">отменённые правки назад не вернуть.</text>
  <text x="360" y="158" font-size="12" fill="#f0a39e">U (новый файл) при отмене удаляется!</text>
  <text x="345" y="214" font-size="12" fill="#9d9d9d">Подсказка: наведите курсор на строку файла,</text>
  <text x="345" y="232" font-size="12" fill="#9d9d9d">справа появятся значки. Значок «Discard All Changes»</text>
  <text x="345" y="250" font-size="12" fill="#9d9d9d">есть и у всего списка CHANGES (в меню «…»).</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <circle cx="272" cy="111" r="11" fill="#d9534f"/><text x="272" y="115" text-anchor="middle">1</text>
  </g>
  <text x="16" y="360" font-size="11" fill="#8a8a8a">Положение значков зависит от версии редактора.</text>
</svg>
