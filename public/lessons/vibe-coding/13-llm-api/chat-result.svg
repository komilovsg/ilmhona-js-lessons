<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="418" rx="14" fill="#f7f8fa" stroke="#c9ced8" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="38" rx="14" fill="#e6e9ef"/><rect x="1" y="22" width="718" height="17" fill="#e6e9ef"/>
  <circle cx="22" cy="20" r="5" fill="#ff6b6b"/><circle cx="40" cy="20" r="5" fill="#ffcc4d"/><circle cx="58" cy="20" r="5" fill="#4cd37b"/>
  <rect x="90" y="9" width="520" height="22" rx="11" fill="#fff" stroke="#c9ced8"/>
  <text x="106" y="25" font-size="13" fill="#444" font-family="ui-monospace, Menlo, Consolas, monospace">localhost:3000 / assistant</text>
  <rect x="1" y="40" width="718" height="379" fill="#ffffff"/>
  <rect x="150" y="56" width="420" height="350" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <rect x="150" y="56" width="420" height="44" rx="14" fill="#0f766e"/><rect x="150" y="80" width="420" height="20" fill="#0f766e"/>
  <text x="170" y="84" font-size="15" font-weight="800" fill="#ffffff">Бахтиёр · помощник кофейни</text>
  <rect x="330" y="116" width="224" height="34" rx="14" fill="#0f766e"/><text x="344" y="138" font-size="13" fill="#ffffff">Что у вас на завтрак?</text>
  <rect x="166" y="162" width="330" height="62" rx="14" fill="#ffffff" stroke="#99d5cd"/>
  <text x="180" y="184" font-size="13" fill="#134e4a">Салом! На завтрак есть сомса, творожная</text><text x="180" y="204" font-size="13" fill="#134e4a">запеканка и свежий чай с мятой.</text>
  <rect x="330" y="238" width="224" height="34" rx="14" fill="#0f766e"/><text x="344" y="260" font-size="13" fill="#ffffff">А сколько стоит сомса?</text>
  <rect x="166" y="284" width="330" height="62" rx="14" fill="#ffffff" stroke="#99d5cd"/>
  <text x="180" y="306" font-size="13" fill="#134e4a">Сомса стоит 8 сомони. Горячая, прямо из</text><text x="180" y="326" font-size="13" fill="#134e4a">печи, а ответ ещё печатается▌</text>
  <rect x="166" y="362" width="300" height="32" rx="16" fill="#ffffff" stroke="#99d5cd"/><text x="182" y="383" font-size="13" fill="#6b7280">Напишите сообщение…</text>
  <rect x="476" y="362" width="78" height="32" rx="16" fill="#9ca3af"/><text x="515" y="383" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Ждём…</text>
  <text x="590" y="150" font-size="12" fill="#4b5563">Текст появляется</text><text x="590" y="167" font-size="12" fill="#4b5563">кусочками (стриминг)</text>
  <text x="590" y="387" font-size="12" fill="#4b5563">Кнопка выключена,</text><text x="590" y="404" font-size="12" fill="#4b5563">пока идёт ответ</text>
  <text x="14" y="408" font-size="11" fill="#6b7280">Упрощённая схема</text>
</svg>
