  <rect x="90" y="9" width="520" height="22" rx="11" fill="#fff" stroke="#c9ced8"/>
  <text x="106" y="25" font-size="13" fill="#444" font-family="ui-monospace, Menlo, Consolas, monospace">панель Supabase / Authentication / Sign In / Providers</text>
