  <!-- arrow -->
  <path d="M338 140h28" stroke="#9aa3ad" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M366 133l10 7-10 7z" fill="#9aa3ad"/>
  <!-- right: configure -->
  <text x="392" y="72" font-size="15" font-weight="700" fill="#1f2a26">2. New Project</text>
  <text x="392" y="100" font-size="12" fill="#5b6670">Project Name</text>
  <rect x="392" y="106" width="300" height="28" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text x="404" y="125" font-size="13" fill="#1f2a26" font-family="ui-monospace, Menlo, Consolas, monospace">dental-landing</text>
  <text x="392" y="158" font-size="12" fill="#5b6670">Framework Preset</text>
  <rect x="392" y="164" width="300" height="28" rx="6" fill="#eef2f0" stroke="#0e7a55" stroke-width="2"/>
  <text x="404" y="183" font-size="13" fill="#1f2a26">Next.js  (определился сам)</text>
