  <text x="38" y="145" font-size="13" fill="#1f2a26">dental-landing</text>
  <rect x="254" y="127" width="62" height="26" rx="6" fill="#1f2a26"/>
  <text x="285" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Import</text>
