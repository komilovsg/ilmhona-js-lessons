<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="14" fill="#f7f8fa" stroke="#c9ced8" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="38" rx="14" fill="#e6e9ef"/><rect x="1" y="22" width="718" height="17" fill="#e6e9ef"/>
  <circle cx="22" cy="20" r="5" fill="#ff6b6b"/><circle cx="40" cy="20" r="5" fill="#ffcc4d"/><circle cx="58" cy="20" r="5" fill="#4cd37b"/>
  <rect x="90" y="9" width="520" height="22" rx="11" fill="#fff" stroke="#c9ced8"/>
  <text x="106" y="25" font-size="13" fill="#444" font-family="ui-monospace, Menlo, Consolas, monospace">панель Supabase / ваш проект / SQL Editor</text>
  <rect x="1" y="40" width="718" height="359" fill="#ffffff"/>
  <rect x="1" y="40" width="170" height="359" fill="#f3f4f6"/>
  <text x="22" y="70" font-size="13" fill="#444">Table Editor</text>
  <rect x="10" y="82" width="152" height="28" rx="6" fill="#dbeafe"/>
  <text x="22" y="101" font-size="13" font-weight="700" fill="#1e40af">SQL Editor</text>
  <rect x="190" y="54" width="502" height="170" rx="8" fill="#1f2937"/>
  <g font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#e5e7eb">
    <text x="206" y="80">create table bookings (</text>
    <text x="222" y="100">id bigint generated always as identity primary key,</text>
    <text x="222" y="120">name text not null,</text>
    <text x="222" y="140">guests int not null</text>
    <text x="206" y="160">);</text>
    <text x="206" y="190">alter table bookings enable row level security;</text>
  </g>
  <rect x="600" y="234" width="92" height="30" rx="6" fill="#16a34a"/>
  <text x="646" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Run</text>
  <rect x="190" y="276" width="502" height="100" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="206" y="300" font-size="12" font-weight="700" fill="#374151">Результат (Results)</text>
  <text x="206" y="324" font-size="13" fill="#166534" font-family="ui-monospace, Menlo, Consolas, monospace">Success. No rows returned</text>
  <text x="206" y="352" font-size="12" fill="#6b7280">Красная надпись вместо этого = ошибка в запросе: скопируйте её целиком.</text>
</svg>
