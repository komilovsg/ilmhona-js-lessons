  <g font-size="13" fill="#1f2a26">
    <line x1="196" y1="146" x2="692" y2="146" stroke="#e5e7eb"/><line x1="196" y1="176" x2="692" y2="176" stroke="#e5e7eb"/><line x1="196" y1="206" x2="692" y2="206" stroke="#e5e7eb"/>
    <text x="206" y="136">1</text><text x="250" y="136">Мадина</text><text x="350" y="136">+992 900 00 00 01</text><text x="470" y="136">2</text><text x="540" y="136">new</text>
