<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="358" rx="14" fill="#f7f8fa" stroke="#c9ced8" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="38" rx="14" fill="#e6e9ef"/><rect x="1" y="22" width="718" height="17" fill="#e6e9ef"/>
  <circle cx="22" cy="20" r="5" fill="#ff6b6b"/><circle cx="40" cy="20" r="5" fill="#ffcc4d"/><circle cx="58" cy="20" r="5" fill="#4cd37b"/>
  <rect x="90" y="9" width="520" height="22" rx="11" fill="#fff" stroke="#c9ced8"/>
  <text x="106" y="25" font-size="13" fill="#444" font-family="ui-monospace, Menlo, Consolas, monospace">панель Supabase / ваш проект / Settings / API Keys</text>
  <rect x="1" y="40" width="718" height="319" fill="#ffffff"/>
  <text x="26" y="72" font-size="16" font-weight="700" fill="#1f2a26">API Keys</text>
  <rect x="26" y="88" width="330" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="42" y="114" font-size="14" font-weight="700" fill="#166534">Publishable key</text>
  <text x="42" y="138" font-size="13" fill="#166534" font-family="ui-monospace, Menlo, Consolas, monospace">sb_publishable_••••••••</text>
  <text x="42" y="164" font-size="12" fill="#166534">Можно в браузере. Права ограничивает RLS.</text>
  <text x="42" y="184" font-size="12" fill="#166534">Идёт в NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY</text>
  <rect x="372" y="88" width="322" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="388" y="114" font-size="14" font-weight="700" fill="#991b1b">Secret key</text>
  <text x="388" y="138" font-size="13" fill="#991b1b" font-family="ui-monospace, Menlo, Consolas, monospace">sb_secret_••••••••</text>
  <text x="388" y="164" font-size="12" fill="#991b1b">Только сервер. Обходит RLS.</text>
  <text x="388" y="184" font-size="12" fill="#991b1b">Без NEXT_PUBLIC_, не в Git, не в чат</text>
  <rect x="26" y="228" width="668" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="42" y="254" font-size="13" font-weight="700" fill="#92400e">Старые названия (в старых туториалах)</text>
  <text x="42" y="278" font-size="12" fill="#92400e">anon key  = то же, что publishable.  service_role key  = то же, что secret.</text>
  <text x="42" y="300" font-size="12" fill="#92400e">Это длинные ключи, начинающиеся с eyJ. Supabase планирует отключить их до конца 2026 года.</text>
</svg>
