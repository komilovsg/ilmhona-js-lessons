<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="14" fill="#1e222a" stroke="#4a5160" stroke-width="2"/>
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Четыре приёма: у каждого свой state</text>
  <g font-size="12" font-weight="700">
    <!-- 1 burger -->
    <rect x="20" y="46" width="160" height="150" rx="10" fill="#0f1319" stroke="#4a5160" stroke-width="2"/>
    <text x="100" y="66" text-anchor="middle" fill="#9ccfff">1. Бургер-меню</text>
    <rect x="30" y="76" width="140" height="26" rx="6" fill="#075985"/>
    <text x="40" y="94" fill="#fff">Улыбка</text>
    <rect x="136" y="80" width="28" height="18" rx="5" fill="#0284c7"/><text x="150" y="94" text-anchor="middle" fill="#fff">✕</text>
    <rect x="30" y="108" width="140" height="24" rx="5" fill="#1e3a4f"/><text x="40" y="125" fill="#e6edf3">Цены</text>
    <rect x="30" y="136" width="140" height="24" rx="5" fill="#1e3a4f"/><text x="40" y="153" fill="#e6edf3">Врачи</text>
    <text x="100" y="184" text-anchor="middle" fill="#ffd479" font-family="ui-monospace, Menlo, monospace">open = true</text>
    <!-- 2 modal -->
    <rect x="190" y="46" width="160" height="150" rx="10" fill="#0f1319" stroke="#4a5160" stroke-width="2"/>
    <text x="270" y="66" text-anchor="middle" fill="#9ccfff">2. Модальное окно</text>
    <rect x="198" y="74" width="144" height="94" rx="6" fill="#000" opacity=".55"/>
    <rect x="212" y="88" width="116" height="66" rx="8" fill="#f1f5f9"/>
    <text x="270" y="108" text-anchor="middle" fill="#111">Запись на приём</text>
    <rect x="236" y="124" width="68" height="20" rx="5" fill="#0284c7"/><text x="270" y="138" text-anchor="middle" fill="#fff">Закрыть</text>
    <text x="270" y="184" text-anchor="middle" fill="#ffd479" font-family="ui-monospace, Menlo, monospace">open = true</text>
    <!-- 3 tabs -->
    <rect x="360" y="46" width="160" height="150" rx="10" fill="#0f1319" stroke="#4a5160" stroke-width="2"/>
    <text x="440" y="66" text-anchor="middle" fill="#9ccfff">3. Вкладки</text>
    <rect x="368" y="78" width="46" height="22" rx="5" fill="#0284c7"/><text x="391" y="93" text-anchor="middle" fill="#fff">Цены</text>
    <rect x="418" y="78" width="46" height="22" rx="5" fill="none" stroke="#0284c7" stroke-width="2"/><text x="441" y="93" text-anchor="middle" fill="#9ccfff">Врачи</text>
    <rect x="468" y="78" width="44" height="22" rx="5" fill="none" stroke="#0284c7" stroke-width="2"/><text x="490" y="93" text-anchor="middle" fill="#9ccfff">Адрес</text>
    <rect x="368" y="108" width="144" height="56" rx="6" fill="#1e3a4f"/>
    <text x="378" y="130" fill="#e6edf3">Чистка 200 сомони</text><text x="378" y="148" fill="#e6edf3">Пломба 350 сомони</text>
    <text x="440" y="184" text-anchor="middle" fill="#ffd479" font-family="ui-monospace, Menlo, monospace">active = "prices"</text>
    <!-- 4 theme -->
    <rect x="530" y="46" width="170" height="150" rx="10" fill="#0f1319" stroke="#4a5160" stroke-width="2"/>
    <text x="615" y="66" text-anchor="middle" fill="#9ccfff">4. Тёмная тема</text>
    <rect x="540" y="78" width="70" height="70" rx="8" fill="#f8fafc"/><text x="575" y="118" text-anchor="middle" fill="#111">светлая</text>
    <rect x="620" y="78" width="70" height="70" rx="8" fill="#0b1220" stroke="#4a5160"/><text x="655" y="118" text-anchor="middle" fill="#e6edf3">тёмная</text>
    <text x="615" y="184" text-anchor="middle" fill="#ffd479" font-family="ui-monospace, Menlo, monospace">dark = true</text>
  </g>
  <rect x="20" y="214" width="680" height="146" rx="10" fill="#0f1319" stroke="#4a5160" stroke-width="2"/>
  <g font-size="13" font-weight="700" fill="#e6edf3">
    <text x="36" y="240">Общий рецепт</text>
  </g>
  <g font-size="13" font-weight="600" fill="#c9d1d9">
    <text x="36" y="266">1. Событие: пользователь нажал или ввёл текст (onClick, onChange).</text>
    <text x="36" y="290">2. Обработчик вызывает сеттер: setOpen(true), setActive("prices").</text>
    <text x="36" y="314">3. React перерисовывает компонент с новым значением state.</text>
    <text x="36" y="338">4. Условный рендер превращает значение в картинку: {open &amp;&amp; …}.</text>
  </g>
</svg>
