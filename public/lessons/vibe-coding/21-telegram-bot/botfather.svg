<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="418" rx="14" fill="#f7f8fa" stroke="#c9ced8" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="48" rx="14" fill="#e6e9ef"/><rect x="1" y="30" width="718" height="19" fill="#e6e9ef"/>
  <circle cx="30" cy="25" r="14" fill="#2563eb"/><text x="30" y="30" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">B</text>
  <text x="54" y="22" font-size="15" font-weight="800" fill="#111827">BotFather</text><text x="54" y="39" font-size="12" fill="#4b5563">официальный бот для создания ботов (проверьте синюю галочку)</text>
  <rect x="20" y="66" width="190" height="34" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="34" y="88" font-size="14" font-weight="700" fill="#1e3a8a" font-family="ui-monospace, Menlo, monospace">/newbot</text>
  <rect x="20" y="110" width="420" height="52" rx="12" fill="#fff" stroke="#c9ced8"/><text x="34" y="132" font-size="13.5" fill="#111827">Alright, a new bot. How are we going to call it?</text><text x="34" y="150" font-size="13.5" fill="#111827">Please choose a name for your bot.</text>
  <rect x="470" y="176" width="230" height="34" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="486" y="198" font-size="14" fill="#1e3a8a">Choyxona Rudaki Bot</text>
  <rect x="20" y="222" width="460" height="52" rx="12" fill="#fff" stroke="#c9ced8"/><text x="34" y="244" font-size="13.5" fill="#111827">Now choose a username for your bot.</text><text x="34" y="262" font-size="13.5" fill="#111827">It must end in `bot`. Like this: TetrisBot or tetris_bot.</text>
  <rect x="470" y="288" width="230" height="34" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="486" y="310" font-size="14" fill="#1e3a8a" font-family="ui-monospace, Menlo, monospace">choyxona_rudaki_bot</text>
  <rect x="20" y="334" width="560" height="72" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="34" y="356" font-size="13.5" fill="#111827">Done! Congratulations on your new bot.</text>
  <text x="34" y="376" font-size="13.5" fill="#111827">Use this token to access the HTTP API:</text>
  <rect x="34" y="384" width="400" height="16" rx="4" fill="#fecaca"/><text x="44" y="396" font-size="11" fill="#991b1b" font-weight="700">1234567890:AA•••••••••••••••••  (токен: секрет, не показывать)</text>
</svg>
