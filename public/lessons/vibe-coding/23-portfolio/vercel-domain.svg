<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="358" rx="14" fill="#f7f8fa" stroke="#c9ced8" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="38" rx="14" fill="#e6e9ef"/><rect x="1" y="22" width="718" height="17" fill="#e6e9ef"/>
  <circle cx="22" cy="20" r="5" fill="#ff6b6b"/><circle cx="40" cy="20" r="5" fill="#ffcc4d"/><circle cx="58" cy="20" r="5" fill="#4cd37b"/>
  <rect x="90" y="9" width="520" height="22" rx="11" fill="#fff" stroke="#c9ced8"/><text x="350" y="24" font-size="12" fill="#4b5563" text-anchor="middle">Панель хостинга · проект · Settings · Domains</text>
  <rect x="14" y="52" width="692" height="294" rx="10" fill="#fff" stroke="#c9ced8"/>
  <rect x="14" y="52" width="150" height="294" rx="10" fill="#f3f4f6"/>
  <text x="34" y="84" font-size="13" fill="#4b5563">General</text>
  <rect x="24" y="98" width="130" height="28" rx="8" fill="#dbeafe"/><text x="34" y="117" font-size="13" font-weight="800" fill="#1e3a8a">Domains</text>
  <text x="34" y="150" font-size="13" fill="#4b5563">Environment Variables</text>
  <text x="188" y="84" font-size="15" font-weight="800" fill="#111827">Domains</text>
  <rect x="188" y="98" width="330" height="34" rx="8" fill="#fff" stroke="#9ca3af"/><text x="202" y="120" font-size="13" fill="#111827">mydomain.com</text>
  <rect x="530" y="98" width="150" height="34" rx="8" fill="#111827"/><text x="605" y="120" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Add Domain</text>
  <text x="188" y="164" font-size="12" fill="#4b5563">Затем панель покажет, какие записи добавить у регистратора:</text>
  <rect x="188" y="174" width="492" height="26" fill="#e6e9ef"/>
  <text x="200" y="192" font-size="12" font-weight="800" fill="#111827">Type</text><text x="280" y="192" font-size="12" font-weight="800" fill="#111827">Name</text><text x="380" y="192" font-size="12" font-weight="800" fill="#111827">Value</text>
  <rect x="188" y="200" width="492" height="30" fill="#fff" stroke="#e5e7eb"/>
  <text x="200" y="220" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#111827">A</text><text x="280" y="220" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#111827">@</text><text x="380" y="220" font-size="12" fill="#4b5563">значение из панели (IP-адрес)</text>
  <rect x="188" y="230" width="492" height="30" fill="#fff" stroke="#e5e7eb"/>
  <text x="200" y="250" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#111827">CNAME</text><text x="280" y="250" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#111827">www</text><text x="380" y="250" font-size="12" fill="#4b5563">значение из панели (адрес вида ….vercel-dns…)</text>
  <rect x="188" y="280" width="170" height="26" rx="13" fill="#fef3c7" stroke="#d97706"/><text x="273" y="297" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">ждём: DNS обновляется</text>
  <rect x="372" y="280" width="170" height="26" rx="13" fill="#ecfdf5" stroke="#16a34a"/><text x="457" y="297" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">готово: сайт открывается</text>
  <text x="188" y="330" font-size="11" fill="#6b7280">Упрощённая схема: названия кнопок и вид панели могут отличаться, значения всегда берите из своей панели</text>
</svg>
