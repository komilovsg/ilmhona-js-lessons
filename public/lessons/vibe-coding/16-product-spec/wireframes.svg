  <rect x="16" y="40" width="210" height="30" rx="10" fill="#e6e9ef"/>
  <text x="30" y="60" font-size="12" font-weight="700" fill="#374151">Столик</text>
  <text x="34" y="110" font-size="13" font-weight="700" fill="#1f2a26">Войти</text>
  <rect x="34" y="124" width="174" height="30" rx="6" fill="#f3f4f6" stroke="#9aa3b2"/>
  <text x="44" y="144" font-size="12" fill="#6b7280">e-mail</text>
  <rect x="34" y="166" width="174" height="30" rx="6" fill="#f3f4f6" stroke="#9aa3b2"/>
  <text x="44" y="186" font-size="12" fill="#6b7280">пароль</text>
  <rect x="34" y="214" width="174" height="34" rx="8" fill="#1f2937"/>
