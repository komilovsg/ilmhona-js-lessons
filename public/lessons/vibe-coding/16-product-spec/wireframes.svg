  <text x="638" y="136" font-size="11" font-weight="700" fill="#374151">Статус</text>
  <text x="516" y="166" font-size="12" fill="#1f2a26">Мадина</text><text x="580" y="166" font-size="12" fill="#1f2a26">19:00</text><text x="638" y="166" font-size="12" fill="#1f2a26">новая</text>
  <rect x="508" y="176" width="182" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="599" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Подтвердить</text>
  <line x1="508" y1="214" x2="690" y2="214" stroke="#e5e7eb"/>
  <text x="516" y="238" font-size="12" fill="#1f2a26">Фирдавс</text><text x="580" y="238" font-size="12" fill="#1f2a26">20:00</text><text x="638" y="238" font-size="12" fill="#1f2a26">готово</text>
  <text x="599" y="298" text-anchor="middle" font-size="12" fill="#6b7280">страница только для role = admin</text>
</svg>
