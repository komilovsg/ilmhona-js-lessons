  <text x="360" y="298" text-anchor="middle" font-size="12" fill="#6b7280">после отправки: статус «новая»</text>
  <!-- Экран 3: админ -->
  <rect x="494" y="40" width="210" height="280" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="2"/>
  <text x="494" y="28" font-size="14" font-weight="700" fill="#1f2a26">3 · Список броней (admin)</text>
