  <text x="269" y="60" font-size="12" font-weight="700" fill="#374151">Столик · Мои брони</text>
  <text x="273" y="100" font-size="12" font-weight="700" fill="#1f2a26">Дата</text>
  <rect x="273" y="108" width="174" height="28" rx="6" fill="#f3f4f6" stroke="#9aa3b2"/>
  <text x="283" y="127" font-size="12" fill="#6b7280">28 октября</text>
  <text x="273" y="158" font-size="12" font-weight="700" fill="#1f2a26">Время</text>
