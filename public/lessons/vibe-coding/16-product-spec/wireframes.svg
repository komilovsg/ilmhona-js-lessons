<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="14" fill="#f7f8fa" stroke="#c9ced8" stroke-width="2"/>
  <!-- Экран 1: вход -->
  <rect x="16" y="40" width="210" height="280" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="2"/>
